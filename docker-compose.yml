version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: contentflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contentflow
    ports:
      - "5432:5432"
    volumes:
      - contentflow_data:/var/lib/postgresql/data

volumes:
  contentflow_data:
